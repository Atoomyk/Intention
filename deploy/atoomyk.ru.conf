# Intention (@atoomyk.ru) — nginx: HTTPS + прокси на uvicorn 127.0.0.1:8000
#
# Установка:
#   sudo cp deploy/atoomyk.ru.conf /etc/nginx/sites-available/atoomyk.ru.conf
#   sudo ln -s /etc/nginx/sites-available/atoomyk.ru.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS-сертификат создаёт certbot (см. deploy/README-deploy.md): он сам допишет
# ssl_certificate/ssl_certificate_key, если файла ещё нет — до этого nginx -t
# со блоком :443 упадёт. Порядок: сначала certbot --nginx, потом reload.

limit_req_zone $binary_remote_addr zone=intention_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name atoomyk.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://atoomyk.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atoomyk.ru;

    ssl_certificate     /etc/letsencrypt/live/atoomyk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atoomyk.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Включать, когда убедились, что HTTPS работает и http корректно редиректит:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16k;

    # Логин и регистрация — с ограничением частоты (защита от перебора пароля).
    location = /api/login {
        limit_req zone=intention_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/register {
        limit_req zone=intention_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    # Всё остальное: страницы, /app.js, /styles.css, /api/*
    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
    }
}
